[package]
name = "rsqlx"
version = "0.9.0"
edition = "2021"
description = "Async PostgreSQL / MySQL / SQLite driver for Python, powered by Rust's sqlx"
license = "MIT OR Apache-2.0"
authors = ["Yingzi <yingzilkq@163.com>"]
repository = "https://gitee.com/yingzi_shadow/rsqlx"
homepage = "https://gitee.com/yingzi_shadow/rsqlx"

[lib]
name = "rsqlx"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.2", features = ["extension-module", "experimental-async", "chrono"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",          # pure-Rust TLS — no system OpenSSL/Schannel dependency
    "postgres",
    "mysql",
    "mysql-rsa",                # allow caching_sha2_password auth over non-TLS (RSA pubkey)
    "sqlite",
    "chrono",
    "uuid",
    "rust_decimal",
    "migrate",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
rust_decimal = "1"
uuid = { version = "1", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
