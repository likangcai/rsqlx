[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlalchemy-rsqlx"
version = "0.1.0"
description = "SQLAlchemy 2.0 async dialects for rsqlx (PostgreSQL / MySQL / SQLite)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "rsqlx>=0.9.3",
    "SQLAlchemy>=2.0.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]
fastapi = ["fastapi>=0.100", "uvicorn>=0.20"]

[project.entry-points."sqlalchemy.dialects"]
"postgresql.rsqlx" = "sqlalchemy_rsqlx.postgresql:PGDialect_rsqlx"
"mysql.rsqlx" = "sqlalchemy_rsqlx.mysql:MySQLDialect_rsqlx"
"sqlite.rsqlx" = "sqlalchemy_rsqlx.sqlite:SQLiteDialect_rsqlx"

[tool.setuptools.packages.find]
include = ["sqlalchemy_rsqlx*"]
