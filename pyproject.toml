[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rsqlx"
version = "0.1.1"
description = "Async PostgreSQL / MySQL / SQLite driver for Python, powered by Rust's sqlx"
readme = "README.md"
requires-python = ">=3.9"
# Dual-licensed: users may choose either MIT or Apache-2.0 (see LICENSE-MIT and LICENSE-APACHE).
license = { text = "MIT OR Apache-2.0" }
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Yingzi", email = "yingzilkq@163.com" },
]
keywords = ["postgresql", "mysql", "sqlite", "asyncio", "database", "sqlx", "rust"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[tool.maturin]
module-name = "rsqlx"
features = ["pyo3/extension-module"]
