name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ----- build wheels for Windows / macOS / Linux ---------------------------
  build-wheels:
    name: Build ${{ matrix.os }} / CPython ${{ matrix.python }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-22.04
            python: "3.9"
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.10"
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.11"
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.12"
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.13"
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          # Linux aarch64 (glibc)
          - os: ubuntu-22.04
            python: "3.9"
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.10"
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.11"
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.12"
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-22.04
            python: "3.13"
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          # Linux x86_64 musllinux (Alpine / Docker, musl libc)
          - os: ubuntu-22.04
            python: "3.13"
            target: x86_64-unknown-linux-musl
          # Linux aarch64 musllinux (Alpine ARM / Docker)
          - os: ubuntu-22.04
            python: "3.13"
            target: aarch64-unknown-linux-musl
          # Windows x86_64
          - os: windows-latest
            python: "3.9"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.10"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.11"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.12"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.13"
            target: x86_64-pc-windows-msvc
          # macOS x86_64 (Intel)
          - os: macos-13
            python: "3.9"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.10"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.11"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.12"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.13"
            target: x86_64-apple-darwin
          # macOS aarch64 (Apple Silicon)
          - os: macos-14
            python: "3.9"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.10"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.11"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.12"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.13"
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install maturin
        run: pip install maturin

      # Linux aarch64 (glibc) AND musllinux builds use zig as the C toolchain
      # NOTE: macOS aarch64 does NOT need zig — the runner is natively ARM
      - name: Install zig (Linux cross-compile / musl)
        if: matrix.os == 'ubuntu-22.04' && (matrix.target == 'aarch64-unknown-linux-gnu' || contains(matrix.target, 'musl'))
        run: pip install ziglang

      - name: Build wheel
        shell: bash
        run: |
          BASE_ARGS="--release --target ${{ matrix.target }} -i python${{ matrix.python }} --out dist"
          # zig ONLY for Linux aarch64 cross-compile and musl targets
          # macOS aarch64 runners are natively ARM — never pass --zig
          if [[ "${{ matrix.target }}" == *linux-gnu*aarch64* ]] || [[ "${{ matrix.target }}" == *musl* ]]; then
            BASE_ARGS="$BASE_ARGS --zig"
          fi
          if [ -n "${{ matrix.manylinux }}" ]; then
            # Build with manylinux_2_28 primary tag, re-tag for 2_17
            maturin build $BASE_ARGS --manylinux ${{ matrix.manylinux }}
            maturin build $BASE_ARGS --manylinux 2_17
          else
            # Windows / macOS / musllinux: single build
            maturin build $BASE_ARGS
          fi

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.target }}
          path: dist/*.whl

  # ----- sdist ----------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install maturin
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  # ----- publish on tag -------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
