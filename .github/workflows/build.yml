name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ----- build wheels for Windows / macOS / Linux ---------------------------
  build-wheels:
    name: Build ${{ matrix.os }} / CPython ${{ matrix.python }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 glibc (native in manylinux_2_28 container) ──
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.9"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.10"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.11"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.12"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.13"
            target: x86_64-unknown-linux-gnu
          # ── Linux aarch64 glibc (native arm64 runner + aarch64 manylinux container) ──
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.9"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.10"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.11"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.12"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.13"
            target: aarch64-unknown-linux-gnu
          # ── Linux x86_64 musllinux (Alpine-compatible, musl libc) ──
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.9"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.10"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.11"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.12"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.13"
            target: x86_64-unknown-linux-musl
          # ── Linux aarch64 musllinux (native arm64 runner + aarch64 musllinux container) ──
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/musllinux_1_2_aarch64
            python: "3.9"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/musllinux_1_2_aarch64
            python: "3.10"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/musllinux_1_2_aarch64
            python: "3.11"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/musllinux_1_2_aarch64
            python: "3.12"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/musllinux_1_2_aarch64
            python: "3.13"
            target: aarch64-unknown-linux-musl
          # ── Windows x86_64 (no container) ──
          - os: windows-latest
            python: "3.9"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.10"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.11"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.12"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.13"
            target: x86_64-pc-windows-msvc
          # ── macOS x86_64 Intel (no container) ──
          - os: macos-13
            python: "3.9"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.10"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.11"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.12"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.13"
            target: x86_64-apple-darwin
          # ── macOS aarch64 Apple Silicon (no container) ──
          - os: macos-14
            python: "3.9"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.10"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.11"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.12"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.13"
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # Linux (manylinux/musllinux containers): use pre-installed Python
      # Windows / macOS: use setup-python action
      - name: Set up Python (Linux container)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PY_VER="${{ matrix.python }}"
          PY_NODOT="${PY_VER//.}"
          echo "PYTHON=/opt/python/cp${PY_NODOT}-cp${PY_NODOT}/bin/python" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: ${{ matrix.python }}

      - name: Install maturin
        shell: bash
        run: |
          if [ -n "${PYTHON:-}" ]; then
            $PYTHON -m pip install --upgrade pip
            $PYTHON -m pip install maturin
          else
            python -m pip install --upgrade pip
            python -m pip install maturin
          fi

      - name: Build wheel
        shell: bash
        run: |
          BASE_ARGS="--release --target ${{ matrix.target }} --out dist --strip"
          # Use explicit interpreter path for Linux containers, auto-detect for Win/Mac
          if [ -n "${PYTHON:-}" ]; then
            BASE_ARGS="$BASE_ARGS -i $PYTHON"
          fi
          # manylinux/musllinux containers bundle the right toolchain and the
          # matching-architecture Python, so builds are native (no zig needed).
          # We tag each wheel with the SAME manylinux/musllinux version as the
          # build container — auditwheel rejects re-tagging to an OLDER glibc
          # (e.g. a 2_28-built wheel cannot be tagged manylinux_2_17).
          case "${{ matrix.container }}" in
            *manylinux*)
              maturin build $BASE_ARGS --compatibility manylinux_2_28
              ;;
            *musllinux*)
              maturin build $BASE_ARGS --compatibility musllinux_1_2
              ;;
            *)
              # Windows / macOS: native build, no compatibility flag needed
              maturin build $BASE_ARGS
              ;;
          esac

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.target }}
          path: dist/*.whl

  # ----- sdist ----------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        shell: bash
        run: |
          /opt/python/cp313-cp313/bin/python -m pip install --upgrade pip
          /opt/python/cp313-cp313/bin/python -m pip install maturin
          /opt/python/cp313-cp313/bin/python -m maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  # ----- publish on tag -------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
