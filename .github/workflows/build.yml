name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ----- build wheels for Windows / macOS / Linux ---------------------------
  build-wheels:
    name: Build ${{ matrix.os }} / CPython ${{ matrix.python }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 glibc (native in manylinux_2_28 container) ──
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.9"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.10"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.11"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.12"
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            python: "3.13"
            target: x86_64-unknown-linux-gnu
          # ── Linux aarch64 glibc (native arm64 runner + aarch64 manylinux container) ──
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.9"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.10"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.11"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.12"
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            python: "3.13"
            target: aarch64-unknown-linux-gnu
          # ── Linux x86_64 musllinux (Alpine-compatible, musl libc) ──
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.9"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.10"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.11"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.12"
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            container: quay.io/pypa/musllinux_1_2_x86_64
            python: "3.13"
            target: x86_64-unknown-linux-musl
          # ── Linux aarch64 musllinux (native arm64 runner, built with zig) ──
          # No Alpine container here: GH Actions JS steps (checkout/setup-python/
          # upload-artifact) cannot run inside an Alpine container on arm64 runners.
          # maturin --zig links against musl natively on the arm64 runner instead.
          - os: ubuntu-24.04-arm
            python: "3.9"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            python: "3.10"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            python: "3.11"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            python: "3.12"
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            python: "3.13"
            target: aarch64-unknown-linux-musl
          # ── Windows x86_64 (no container) ──
          - os: windows-latest
            python: "3.9"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.10"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.11"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.12"
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            python: "3.13"
            target: x86_64-pc-windows-msvc
          # ── macOS x86_64 Intel (no container) ──
          - os: macos-13
            python: "3.9"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.10"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.11"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.12"
            target: x86_64-apple-darwin
          - os: macos-13
            python: "3.13"
            target: x86_64-apple-darwin
          # ── macOS aarch64 Apple Silicon (no container) ──
          - os: macos-14
            python: "3.9"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.10"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.11"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.12"
            target: aarch64-apple-darwin
          - os: macos-14
            python: "3.13"
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # Container rows (manylinux + x86_64 musllinux): use the pre-installed
      # Python inside the image. No-container rows (Windows/macOS/aarch64 musllinux):
      # use the setup-python action.
      - name: Set up Python (Linux container)
        if: ${{ matrix.container }}
        shell: bash
        run: |
          PY_VER="${{ matrix.python }}"
          PY_NODOT="${PY_VER//.}"
          echo "PYTHON=/opt/python/cp${PY_NODOT}-cp${PY_NODOT}/bin/python" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: ${{ !matrix.container }}
        with:
          python-version: ${{ matrix.python }}

      - name: Install maturin
        shell: bash
        run: |
          # maturin[zig] provides the `zig` helper maturin needs for `--zig` musl builds.
          if [ -n "${PYTHON:-}" ]; then
            $PYTHON -m pip install --upgrade pip
            $PYTHON -m pip install "maturin[zig]"
          else
            python -m pip install --upgrade pip
            python -m pip install "maturin[zig]"
          fi

      - name: Build wheel
        shell: bash
        run: |
          BASE_ARGS="--release --target ${{ matrix.target }} --out dist --strip"
          # Containers: invoke maturin via the image Python (its bin dir is NOT on PATH).
          # No-container rows: invoke via `python -m maturin` (setup-python python, reliable).
          if [ -n "${PYTHON:-}" ]; then
            BASE_ARGS="$BASE_ARGS -i $PYTHON"
            MATURIN="$PYTHON -m maturin"
          else
            MATURIN="python -m maturin"
          fi
          # manylinux glibc containers: native build, tag with the SAME manylinux
          # version as the container (auditwheel rejects re-tagging to an OLDER glibc).
          # musllinux: x86_64 builds inside the Alpine container on x64; aarch64 builds
          # natively on the arm64 runner via `maturin --zig` (no Alpine container, since
          # GH Actions JS steps can't run in an Alpine container on arm64).
          # Windows / macOS: native build, no compatibility flag needed.
          case "${{ matrix.target }}" in
            *linux-gnu)
              $MATURIN build $BASE_ARGS --compatibility manylinux_2_28
              ;;
            *linux-musl)
              if [ -n "${PYTHON:-}" ]; then
                $MATURIN build $BASE_ARGS --compatibility musllinux_1_2
              else
                # No-container musl build (aarch64 on arm64 runner): maturin's
                # interpreter auto-discovery fails here, so pin the setup-python
                # interpreter explicitly with -i. maturin needs a VERSIONED name
                # (python3.13) to infer the ABI — the bare 'python' it skips.
                PY_BIN="$(python -c 'import sys; print(sys.executable)')"
                PY_DIR="$(dirname "$PY_BIN")"
                VER_INT="python${{ matrix.python }}"
                if [ ! -x "$PY_DIR/$VER_INT" ]; then
                  ln -sf "$PY_BIN" "$PY_DIR/$VER_INT"
                fi
                $MATURIN build $BASE_ARGS -i "$PY_DIR/$VER_INT" --zig --compatibility musllinux_1_2
              fi
              ;;
            *)
              $MATURIN build $BASE_ARGS
              ;;
          esac

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.target }}
          path: dist/*.whl

  # ----- sdist ----------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        shell: bash
        run: |
          /opt/python/cp313-cp313/bin/python -m pip install --upgrade pip
          /opt/python/cp313-cp313/bin/python -m pip install maturin
          /opt/python/cp313-cp313/bin/python -m maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  # ----- publish on tag -------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
