name: sqlalchemy-rsqlx

on:
  push:
    paths:
      - "sqlalchemy_rsqlx/**"
      - "src/**"
      - "Cargo.toml"
      - "pyproject.toml"
      - ".github/workflows/dialect.yml"
  pull_request:
    paths:
      - "sqlalchemy_rsqlx/**"
      - "src/**"
      - "Cargo.toml"
      - "pyproject.toml"
      - ".github/workflows/dialect.yml"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build and install rsqlx from source
        shell: bash
        run: |
          maturin build -o dist
          python -m pip install --force-reinstall --no-deps dist/rsqlx-*.whl

      - name: Install dialect package
        run: python -m pip install -e ./sqlalchemy_rsqlx

      - name: Run dialect tests
        run: python -m pytest sqlalchemy_rsqlx/tests -q
